name: Publication

# Release GitHub publiée (tag vX.Y.Z) : npm, par publication de confiance (OIDC),
# sans jeton, avec attestation de provenance. Voir PUBLICATION.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  npm:
    name: npm
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pharmassistant
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm assez récent pour la publication de confiance
        run: npm install -g npm@latest && npm --version
      - name: Tag égal à la version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG  version=$VERSION"
          test "$TAG" = "v$VERSION"
      - run: npm ci
      - name: Publier
        run: npm publish --access public --provenance
